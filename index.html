*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);background:var(--bg);color:var(--text)}

.nb{background:none;border:none;cursor:pointer;display:flex;align-items:center}

.card{background:#fff;border:1px solid var(--border);border-radius:2px}
.hov:hover{background:#f3f2f1;cursor:pointer}
.sp-suite{height:48px;background:#292827;display:flex;align-items:center;padding:0 12px;gap:4px;position:sticky;top:0;z-index:300}
.sp-header{background:var(--wh-green);color:white;padding:0 20px;height:50px;display:flex;align-items:center;gap:14px;position:sticky;top:48px;z-index:100}
.sp-nav{background:white;border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;height:44px;position:sticky;top:98px;z-index:100;overflow-x:auto;gap:2px}
.sp-ni{padding:0 12px;height:44px;display:flex;align-items:center;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;color:#323130;white-space:nowrap;gap:5px}
.sp-ni:hover{background:#f3f2f1}.sp-ni.on{color:#0078D4;border-bottom-color:#0078D4;font-weight:600}
.tab-bar{display:flex;gap:2px;padding:6px 16px;background:white;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab-btn{padding:5px 10px;font-size:12px;border:none;background:none;cursor:pointer;border-radius:2px;color:#605e5c;display:flex;align-items:center;gap:4px}
.tab-btn.on{background:#e1dfdd;color:#323130;font-weight:600}.tab-btn:hover{background:#f3f2f1}
.filter-bar{background:white;border-bottom:1px solid var(--border);padding:7px 16px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.fi{padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:2px;background:white;color:#323130}
.lh{display:grid;font-size:11px;color:#605e5c;font-weight:600;padding:7px 14px;background:#F3F2F1;border-bottom:1px solid var(--border)}
.lr{display:grid;font-size:12px;padding:7px 14px;align-items:center;border-bottom:1px solid var(--border);background:white}
.lr:hover{background:#f3f2f1;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding-top:80px}
.modal{background:white;border-radius:4px;box-shadow:0 8px 32px rgba(0,0,0,.2);max-height:80vh;display:flex;flex-direction:column}
.alert-box{padding:9px 12px;border-radius:2px;display:flex;gap:8px;align-items:flex-start;font-size:12px}
.btn{display:flex;align-items:center;gap:5px;padding:5px 10px;font-size:12px;border:none;border-radius:2px;cursor:pointer;font-family:var(--font)}
.btn-prim{background:#0078D4;color:white}.btn-prim:hover{background:#006CBE}
.btn-sec{background:white;border:1px solid var(--border);color:#323130}.btn-sec:hover{background:#f3f2f1}
.btn-warn{background:#C07B1B;color:white}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.search-wrap{display:flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--border);border-radius:2px;background:white}
.search-wrap input{border:none;outline:none;background:transparent;font-size:12px;width:100%;color:#323130}
.taux-bar{background:#edebe9;border-radius:3px;overflow:hidden}
.taux-fill{height:100%;border-radius:3px}

            const charge=PROJECTS.filter(p=>p.team.some(t=>t.empId===e.id)).reduce((a,p)=>a+(p.team.find(t=>t.empId===e.id)?.taux||0),0);
            const projs=PROJECTS.filter(p=>p.team.some(t=>t.empId===e.id));
            return(<div key={e.id} className="lr" onClick={()=>setSelCollab(selCollab===e.id?null:e.id)} style={{gridTemplateColumns:'160px 70px 1fr 90px 120px',outline:selCollab===e.id?'1.5px solid #0078D4':'none'}}>
              <div style={{display:'flex',gap:6,alignItems:'center'}}><Av p={e.p} n={e.n} id={e.id} size={24}/><div><p style={{fontSize:11,fontWeight:500}}>{e.p} {e.n}</p><p style={{fontSize:9,color:'#979593'}}>{e.svc.substring(0,18)}</p></div></div>
              <span className="pill" style={{background:sb[e.site],color:sc[e.site],fontSize:9,width:'fit-content'}}>{SITES.find(s=>s.id===e.site)?.code}</span>
              <div style={{paddingRight:12}}><Taux v={e.taux_libre} h={5}/></div>
              <div><Taux v={Math.min(charge,100)} h={5} color={charge>80?'#C03626':charge>50?'#C07B1B':'#1A7A4A'}/><span style={{fontSize:9,color:'#605e5c'}}>{charge}% alloué</span></div>
              <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
                {projs.slice(0,2).map(p=><span key={p.id} className="pill" style={{background:'#F3F2F1',color:'#605e5c',fontSize:8}}>{p.label.substring(0,12)}</span>)}
                {projs.length===0&&<span style={{fontSize:9,color:'#1A7A4A'}}>Disponible</span>}
              </div>
            </div>);
          })}
        </div>
        {collab&&(
          <div className="card" style={{width:240,flexShrink:0,borderTop:'3px solid '+sc[collab.site]}}>
            <div style={{padding:'12px 12px 8px',borderBottom:'1px solid #edebe9'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                <Av p={collab.p} n={collab.n} id={collab.id} size={38}/>
                <button className="nb" onClick={()=>setSelCollab(null)} style={{color:'#979593',padding:2,alignSelf:'flex-start'}}><i className="ti ti-x" style={{fontSize:13}}></i></button>
              </div>
              <p style={{fontSize:12,fontWeight:600}}>{collab.p} {collab.n}</p>
              <p style={{fontSize:10,color:'#605e5c',marginBottom:5}}>{collab.post}</p>
              <span className="pill" style={{background:sb[collab.site],color:sc[collab.site]}}>{SITES.find(s=>s.id===collab.site)?.name}</span>
            </div>
            <div style={{padding:'8px 12px',borderBottom:'1px solid #edebe9',display:'flex',flexDirection:'column',gap:3}}>
              <div style={{display:'flex',gap:5}}><i className="ti ti-phone" style={{fontSize:10,color:'#979593'}}></i><span style={{fontSize:10}}>{collab.tel}</span></div>
              <div style={{display:'flex',gap:5}}><i className="ti ti-device-mobile" style={{fontSize:10,color:'#979593'}}></i><span style={{fontSize:10}}>{collab.mobile}</span></div>
              <div style={{display:'flex',gap:5}}><i className="ti ti-mail" style={{fontSize:10,color:'#979593'}}></i><span style={{fontSize:10,color:'#0067b8'}}>{collab.mail}</span></div>
              <div style={{display:'flex',gap:5}}><i className="ti ti-building" style={{fontSize:10,color:'#979593'}}></i><span style={{fontSize:10}}>{collab.svc}</span></div>
            </div>
            <div style={{padding:'8px 12px',borderBottom:'1px solid #edebe9'}}>
              <p style={{fontSize:9,fontWeight:600,color:'#605e5c',marginBottom:4}}>Compétences</p>
              {collab.sk.map((s,i)=><div key={i} style={{display:'flex',gap:5,alignItems:'center',padding:'2px 0'}}>
                <span className="pill" style={{background:CAT_B[s.cat]||'#F3F2F1',color:CAT_C[s.cat]||'#605e5c',fontSize:8}}>{s.cat}</span>
                <span style={{fontSize:10}}>{s.lib}</span>
              </div>)}
            </div>
            <div style={{padding:'8px 12px',borderBottom:'1px solid #edebe9'}}>
              <p style={{fontSize:9,fontWeight:600,color:'#605e5c',marginBottom:5}}>Planning semaine (disponibilités)</p>
              <div style={{display:'flex',gap:3}}>
                {['L','M','M','J','V'].map((j,i)=>{const dispo=i<4;return(
                  <div key={i} style={{flex:1,textAlign:'center',padding:'4px 0',background:dispo?'#E8F5EE':'#FDECEA',borderRadius:2}}>
                    <p style={{fontSize:8,fontWeight:700,color:dispo?'#1A7A4A':'#C03626'}}>{j}</p>
                    <p style={{fontSize:7,color:dispo?'#1A7A4A':'#C03626'}}>{dispo?'✓':'✗'}</p>
                  </div>
                );})}
              </div>
              <p style={{fontSize:8,color:'#979593',marginTop:3}}>Disponibilité : {collab.taux_libre}%</p>
            </div>
            <div style={{padding:'8px 12px'}}>
              <button className="btn btn-prim" style={{width:'100%',justifyContent:'center'}}><i className="ti ti-user-check" style={{fontSize:12}}></i>Affecter à un projet</button>
            </div>
          </div>
        )}
      </div>
    </div>)}
  </div>);
}

// ── SITES & ÉQUIPES PAGE ──
function EquipesPage(){
  const [selSite,setSelSite]=useState(null);
  const [selEmp,setSelEmp]=useState(null);
  const site=selSite?SITES.find(s=>s.id===selSite):null;
  const sEmps=selSite?EMP.filter(e=>e.site===selSite&&!e.ext):[];
  const sProjs=selSite?PROJECTS.filter(p=>p.site===selSite):[];
  const emp=selEmp?EMP.find(e=>e.id===selEmp):null;
  return(<div style={{padding:16}}>
    <p style={{fontSize:14,fontWeight:600,marginBottom:4}}>Sites & Équipes Wooden Home</p>
    <p style={{fontSize:11,color:'#605e5c',marginBottom:14}}>Cliquez sur un site pour voir les équipes et projets · 5 sites · 358 collaborateurs</p>
    <div className="grid-5" style={{marginBottom:14}}>
      {SITES.map(s=>{
        const emps=EMP.filter(e=>e.site===s.id&&!e.ext);
        const projs=PROJECTS.filter(p=>p.site===s.id);
        const isSel=selSite===s.id;
        return(<div key={s.id} className="card hov" onClick={()=>{setSelSite(isSel?null:s.id);setSelEmp(null);}}
          style={{padding:12,borderTop:'4px solid '+sc[s.id],background:isSel?sb[s.id]:'white',outline:isSel?'1.5px solid '+sc[s.id]:'none',cursor:'pointer'}}>
          <div style={{width:34,height:34,background:sb[s.id],borderRadius:3,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:8}}>
            <i className={`ti ${s.id==='lille'?'ti-building':'ti-building-factory-2'}`} style={{fontSize:18,color:sc[s.id]}}></i>
          </div>
          <p style={{fontSize:13,fontWeight:700,color:sc[s.id]}}>{s.name}</p>
          <p style={{fontSize:9,color:'#605e5c',marginBottom:7}}>{s.sub} · {s.code}</p>
          <div style={{display:'flex',justifyContent:'space-between',paddingTop:7,borderTop:'1px solid #edebe9'}}>
            <div style={{textAlign:'center'}}><p style={{fontSize:16,fontWeight:600,color:sc[s.id]}}>{s.nb_collabs}</p><p style={{fontSize:8,color:'#979593'}}>collabs</p></div>
            <div style={{textAlign:'center'}}><p style={{fontSize:16,fontWeight:600,color:'#C07B1B'}}>{projs.filter(p=>p.statut==='En cours').length}</p><p style={{fontSize:8,color:'#979593'}}>actifs</p></div>
            <div style={{textAlign:'center'}}><p style={{fontSize:16,fontWeight:600,color:'#605e5c'}}>{projs.length}</p><p style={{fontSize:8,color:'#979593'}}>projets</p></div>
          </div>
          <div style={{display:'flex',gap:-3,marginTop:7,overflow:'hidden'}}>
            {emps.slice(0,5).map(e=><div key={e.id} title={e.p+' '+e.n} style={{width:20,height:20,borderRadius:'50%',background:avc(e.id),display:'flex',alignItems:'center',justifyContent:'center',fontSize:7,fontWeight:700,color:'white',border:'1.5px solid white'}}>{(e.p[0]||'')}{(e.n[0]||'')}</div>)}
            {emps.length>5&&<div style={{width:20,height:20,borderRadius:'50%',background:'#edebe9',display:'flex',alignItems:'center',justifyContent:'center',fontSize:7,color:'#605e5c',border:'1.5px solid white'}}>+{emps.length-5}</div>}
          </div>
        </div>);
      })}
    </div>
    {site&&(<div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
      <div style={{flex:1}}>
        {/* Fiche site */}
        <div className="card" style={{padding:14,marginBottom:10,borderTop:'3px solid '+sc[site.id]}}>
          <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:10}}>
            <div style={{width:44,height:44,background:sb[site.id],borderRadius:3,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <i className={`ti ${site.id==='lille'?'ti-building':'ti-building-factory-2'}`} style={{fontSize:22,color:sc[site.id]}}></i>
            </div>
            <div style={{flex:1}}>
              <h2 style={{fontSize:16,fontWeight:600,color:sc[site.id]}}>{site.name}</h2>
              <p style={{fontSize:10,color:'#605e5c'}}>{site.sub} · {site.region}</p>
            </div>
            <button onClick={()=>{setSelSite(null);setSelEmp(null);}} className="btn btn-sec">✕ Fermer</button>
          </div>
          <div style={{display:'flex',gap:16,flexWrap:'wrap',paddingTop:10,borderTop:'1px solid #edebe9'}}>
            {[['ti-map-pin',site.adresse+', '+site.cp+' '+site.ville,'Adresse'],['ti-phone',site.tel,'Téléphone'],['ti-users',site.nb_collabs+' collaborateurs','Effectifs'],['ti-circle-check',site.statut,'Statut']].map(([ic,v,l])=>(
              <div key={l} style={{display:'flex',gap:6,alignItems:'center'}}>
                <i className={'ti '+ic} style={{fontSize:13,color:sc[site.id],flexShrink:0}}></i>
                <div><p style={{fontSize:8,color:'#979593'}}>{l}</p><p style={{fontSize:11,fontWeight:500}}>{v}</p></div>
              </div>
            ))}
          </div>
          <div style={{marginTop:10}}>
            <p style={{fontSize:10,fontWeight:600,color:'#605e5c',marginBottom:5}}>Services ({site.svcs.length})</p>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
              {site.svcs.map(sv=><span key={sv} className="pill" style={{background:sb[site.id],color:sc[site.id]}}>{sv}</span>)}
            </div>
          </div>
        </div>
        {/* Équipe par service */}
        {[...new Set(sEmps.map(e=>e.svc))].map(svc=>{
          const svEmps=sEmps.filter(e=>e.svc===svc);
          return(<div key={svc} className="card" style={{padding:12,marginBottom:7,borderLeft:'3px solid '+sc[site.id]}}>
            <p style={{fontSize:12,fontWeight:600,marginBottom:7}}>{svc} <span style={{fontSize:10,color:'#979593',fontWeight:400}}>({svEmps.length})</span></p>
            <div className="grid-2">
              {svEmps.map(e=>(
                <div key={e.id} className="hov" onClick={()=>setSelEmp(selEmp===e.id?null:e.id)} style={{display:'flex',gap:6,padding:'7px 9px',background:selEmp===e.id?sb[e.site]:'#F3F2F1',borderRadius:2,cursor:'pointer',border:selEmp===e.id?'1px solid '+sc[e.site]:'1px solid transparent'}}>
                  <Av p={e.p} n={e.n} id={e.id} size={24} statut={e.statut}/>
                  <div style={{minWidth:0}}>
                    <p style={{fontSize:10,fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{e.p} {e.n}</p>
                    <p style={{fontSize:8,color:'#979593'}}>{e.post.substring(0,20)}</p>
                    <StatBadge statut={e.statut}/>
                  </div>
                </div>
              ))}
            </div>
          </div>);
        })}
      </div>
      <div style={{width:260,flexShrink:0}}>
        {/* Projets du site */}
        <p style={{fontSize:11,fontWeight:600,color:'#605e5c',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.5px'}}>Projets ({sProjs.length})</p>
        {sProjs.map(p=>(
          <div key={p.id} className="card" style={{padding:10,marginBottom:7,borderTop:'2px solid '+(FAM_C[p.famille]||'#605e5c')}}>
            <p style={{fontSize:11,fontWeight:600,lineHeight:1.3,marginBottom:4}}>{p.label}</p>
            <div style={{display:'flex',gap:4,marginBottom:5,flexWrap:'wrap'}}>
              <StatBadge statut={p.statut}/>
              <span style={{fontSize:9,color:'#605e5c'}}>{p.fin}</span>
            </div>
            <Taux v={p.pct} h={4} color={FAM_C[p.famille]||'#605e5c'}/>
          </div>
        ))}
        {/* Fiche collaborateur */}
        {emp&&(
          <div className="card" style={{padding:0,borderTop:'3px solid '+sc[emp.site],marginTop:10}}>
            <div style={{padding:'10px 12px',borderBottom:'1px solid #edebe9',display:'flex',gap:7,alignItems:'center'}}>
              <Av p={emp.p} n={emp.n} id={emp.id} size={28} statut={emp.statut}/>
              <div style={{flex:1}}>
                <p style={{fontSize:12,fontWeight:600}}>{emp.p} {emp.n}</p>
                <p style={{fontSize:9,color:'#605e5c'}}>{emp.post}</p>
              </div>
              <button className="nb" onClick={()=>setSelEmp(null)} style={{color:'#979593',padding:2}}><i className="ti ti-x" style={{fontSize:12}}></i></button>
            </div>
            <div style={{padding:'8px 12px',borderBottom:'1px solid #edebe9',display:'flex',flexDirection:'column',gap:4}}>
              <p style={{fontSize:9,fontWeight:600,color:'#605e5c',marginBottom:2,textTransform:'uppercase',letterSpacing:'0.5px'}}>Informations de contact</p>
              <div style={{display:'flex',gap:5}}><i className="ti ti-phone" style={{fontSize:10,color:'#1A7A4A'}}></i><span style={{fontSize:10,fontWeight:500}}>{emp.tel}</span></div>
              <div style={{display:'flex',gap:5}}><i className="ti ti-device-mobile" style={{fontSize:10,color:'#0F5BA1'}}></i><span style={{fontSize:10,fontWeight:500}}>{emp.mobile}</span></div>
              <div style={{display:'flex',gap:5}}><i className="ti ti-mail" style={{fontSize:10,color:'#979593'}}></i><span style={{fontSize:10,color:'#0067b8'}}>{emp.mail}</span></div>
            </div>
            <div style={{padding:'7px 12px'}}>
              <p style={{fontSize:9,color:'#605e5c'}}>{emp.svc} · {SITES.find(s=>s.id===emp.site)?.name}</p>
            </div>
          </div>
        )}
      </div>
    </div>)}
  </div>);
}

// ── APP ──
function App(){
  const [logged,setLogged]=useState(false);
  const [pg,setPg]=useState('home');
  const [searchOpen,setSearchOpen]=useState(false);
  useEffect(()=>{
    const h=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();setSearchOpen(true);}};
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[]);
  if(!logged) return <LoginPage onLogin={()=>setLogged(true)}/>;
  return(<div>
    <SuiteBar onSearch={()=>setSearchOpen(true)}/>
    <Header/>
    <Nav pg={pg} setPg={setPg}/>
    <div style={{background:'#F3F2F1',minHeight:'calc(100vh - 142px)'}}>
      {pg==='home'&&<HomePage setPg={setPg}/>}
      {pg==='ged'&&<GEDPage/>}
      {pg==='annuaire'&&<AnnuairePage/>}
      {pg==='projets'&&<ProjetsPage/>}
      {pg==='planning'&&<PlanningPage/>}
      {pg==='equipes'&&<EquipesPage/>}
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
